name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Unit Test Compile Check
      id: unit-test-compile-check
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Unit Test Compile Check
        setup-command: ''
        command: gradle test
        timeout: 10
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        UNIT-TEST-COMPILE-CHECK_RESULTS: "${{steps.unit-test-compile-check.outputs.result}}"
      with:
        runners: unit-test-compile-check
